name: Publicar DOCX de Clara Siqueira
on:
  push:
    paths:
      - 'Clara-Siqueira/payload_*.txt'
      - '.github/workflows/clara-siqueira-docx.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar-documentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar python-docx
        run: python -m pip install python-docx
      - name: Extrair gerador e produzir os documentos
        shell: bash
        run: |
          set -euo pipefail
          cat Clara-Siqueira/payload_*.txt | base64 -d | tar -xjf - -C Clara-Siqueira
          sed -i "s@Path('/mnt/data/candidatura_pht')@Path(__file__).resolve().parent@g" Clara-Siqueira/build.py Clara-Siqueira/patch.py
          python Clara-Siqueira/build.py
          python Clara-Siqueira/patch.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          base=Path('Clara-Siqueira')
          with ZipFile(base/'Candidatura_Clara_Siqueira_PHT_Todos_DOCX.zip','w',ZIP_DEFLATED) as z:
              for file in sorted(base.glob('*.docx')): z.write(file, arcname=file.name)
          print('DOCX completos:',len(list(base.glob('*.docx'))))
          PY
      - name: Publicar DOCX e ZIP no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clara-Siqueira/*.docx Clara-Siqueira/*.zip Clara-Siqueira/build.py Clara-Siqueira/patch.py
          if ! git diff --cached --quiet; then
            git commit -m "Publica os sete volumes DOCX e ZIP da candidatura Clara Siqueira"
            git push
          fi
